name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile kaigi kaigi_core.py kaigi_ops.py kaigi_v6.py kaigi_policy.py kaigi_capabilities.py kaigi_auth.py kaigi_transport.py kaigi_relay.py kaigi_relay_v81.py kaigi_relay_v82.py
      - run: python -m unittest discover -v tests -p 'test_*.py'
      - run: bash -n install.sh
      - name: Local auth discovery invariants
        run: |
          grep -q 'local-session-discovery-v3-identity-separated' kaigi_auth.py
          grep -q 'window\\.__SESSION_TOKEN__' kaigi_auth.py
          grep -q '_is_loopback_url' kaigi_auth.py
          grep -q 'import kaigi_auth as auth' kaigi
          grep -q 'auth.apply_core(core)' kaigi
          ! grep -q 'local-session-discovery-v2-dual-header' kaigi_auth.py
          ! grep -q 'Authorization.*local-index-session\|local-index-session.*Authorization' kaigi_auth.py
          ! grep -q 'write_text.*SESSION_TOKEN\|open.*SESSION_TOKEN' kaigi_auth.py
      - name: AgentChattr transport invariants
        run: |
          grep -q 'identity-separated-session-ws-v1' kaigi_transport.py
          grep -q 'missing Authorization: Bearer <token>' kaigi_transport.py
          grep -q 'Sec-WebSocket-Key' kaigi_transport.py
          grep -q '_LOOPBACK' kaigi_transport.py
          grep -q 'import kaigi_transport as transport' kaigi
          grep -q 'transport.apply_core(core)' kaigi
          grep -q 'KAIGI_TRANSPORT' install.sh
          ! grep -q '/api/register' kaigi_transport.py
          test ! -e tests/test_auth_dual_header.py
          test -f tests/test_auth_header_boundary.py
      - name: Relay cloud source invariants
        run: |
          test -f relay/supabase/schema.sql
          test -f relay/supabase/migrations/001_v8_1_progress.sql
          test -f relay/supabase/functions/kaigi-relay/index.ts
          grep -q 'x-kaigi-worker-token' relay/supabase/functions/kaigi-relay/index.ts
          ! grep -q 'x-kaigi-relay-key' relay/supabase/functions/kaigi-relay/index.ts
          grep -q 'kaigi_relay_enqueue' relay/supabase/schema.sql
          grep -q 'kaigi_relay_heartbeat_v2' relay/supabase/migrations/001_v8_1_progress.sql
          grep -q 'kaigi_relay_heartbeat_v2' relay/supabase/functions/kaigi-relay/index.ts
          grep -q 'protocol: 2' relay/supabase/functions/kaigi-relay/index.ts
          ! grep -q 'OPENAI_API_KEY\|SUPABASE_SERVICE_ROLE_KEY=' relay/supabase/schema.sql relay/supabase/migrations/001_v8_1_progress.sql relay/supabase/functions/kaigi-relay/index.ts
      - name: Relay worker hardening invariants
        run: |
          grep -q '8.1-progress-watchdog' kaigi_relay_v81.py
          grep -q 'local meeting preparation stall' kaigi_relay_v81.py
          grep -q 'local meeting stage stall' kaigi_relay_v81.py
          grep -q '_process_claimed_with_terminal_fail' kaigi_relay_v81.py
          grep -q 'base.cmd_serve = cmd_serve' kaigi_relay_v81.py
          grep -q 'killpg' kaigi_relay_v81.py
      - name: Relay recovery and liveness invariants
        run: |
          grep -q '8.2-recovery-liveness' kaigi_relay_v82.py
          grep -q 'same-run recovery attempted' kaigi_relay_v82.py
          grep -q 'participant-liveness' kaigi_relay_v82.py
          grep -q 'queue_state' kaigi_relay_v82.py
          grep -q 'kaigi_relay_v82' kaigi
          grep -q 'KAIGI_RELAY_V82' install.sh
          test -f tests/test_relay_v82.py
          ! grep -q 'read_text.*queue' kaigi_relay_v82.py
      - name: Provider-neutral installer idempotency
        run: |
          HOME="$RUNNER_TEMP/kaigi-neutral" KAIGI_SKILL_TARGETS=none bash install.sh
          HOME="$RUNNER_TEMP/kaigi-neutral" KAIGI_SKILL_TARGETS=none bash install.sh
          test -L "$RUNNER_TEMP/kaigi-neutral/.local/bin/kaigi"
          test -f "$RUNNER_TEMP/kaigi-neutral/.local/share/kaigi/skills/kaigi/SKILL.md"
          test -f ./kaigi_auth.py
          test -f ./kaigi_transport.py
          test -x ./kaigi_relay.py
          test -x ./kaigi_relay_v81.py
          test -x ./kaigi_relay_v82.py
          test ! -e "$RUNNER_TEMP/kaigi-neutral/.claude"
          test ! -e "$RUNNER_TEMP/kaigi-neutral/.hermes"
          test ! -e "$RUNNER_TEMP/kaigi-neutral/.codex"
          test ! -e "$RUNNER_TEMP/kaigi-neutral/.config/opencode"
      - name: Optional skill adapters
        run: |
          HOME="$RUNNER_TEMP/kaigi-adapters" KAIGI_SKILL_TARGETS=all bash install.sh
          test -f "$RUNNER_TEMP/kaigi-adapters/.local/share/kaigi/skills/kaigi/SKILL.md"
          test -f "$RUNNER_TEMP/kaigi-adapters/.claude/skills/kaigi/SKILL.md"
          test -f "$RUNNER_TEMP/kaigi-adapters/.hermes/skills/kaigi/SKILL.md"
          test -f "$RUNNER_TEMP/kaigi-adapters/.codex/skills/kaigi/SKILL.md"
          test -f "$RUNNER_TEMP/kaigi-adapters/.config/opencode/skills/kaigi/SKILL.md"
